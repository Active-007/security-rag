<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安保集团企业知识库智能问答系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ========== 设计系统 ========== */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-card: #1a2332;
            --bg-input: #0d1520;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.08);
            --border-active: rgba(56,189,248,0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-glow: rgba(56,189,248,0.15);
            --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
            --user-bubble: linear-gradient(135deg, #3b82f6, #6366f1);
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --sidebar-w: 300px;
            --header-h: 60px;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: transform var(--transition);
            z-index: 20;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .logo-text h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
        }

        .new-chat-btn:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            color: var(--accent);
        }

        .new-chat-btn i { font-size: 14px; }

        /* 会话列表 */
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .session-list-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 4px 8px 8px;
        }

        .session-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all var(--transition);
            margin-bottom: 2px;
            position: relative;
        }

        .session-item:hover { background: var(--surface-hover); }

        .session-item.active {
            background: var(--accent-glow);
            border: 1px solid var(--border-active);
        }

        .session-item:not(.active) { border: 1px solid transparent; }

        .session-item .session-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
            flex-shrink: 0;
        }

        .session-item.active .session-icon {
            background: var(--accent-glow);
            color: var(--accent);
        }

        .session-item .session-meta {
            flex: 1;
            min-width: 0;
        }

        .session-item .session-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-item .session-preview {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .session-item .session-delete {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 12px;
            transition: all var(--transition);
        }

        .session-item:hover .session-delete { opacity: 1; }
        .session-item .session-delete:hover { color: var(--danger); }

        /* 侧边栏底部 */
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ========== 主区域 ========== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        /* 顶栏 */
        .topbar {
            height: var(--header-h);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(52,211,153,0.5);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .source-select-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .source-select-wrap label {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .source-select-wrap select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            min-width: 80px;
        }

        .source-select-wrap select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .sidebar-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        /* ========== 聊天区域 ========== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .chat-welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }

        .chat-welcome .welcome-icon {
            width: 72px;
            height: 72px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(56,189,248,0.2);
        }

        .chat-welcome h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .chat-welcome p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 400px;
            line-height: 1.6;
        }

        .chat-welcome .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
            justify-content: center;
        }

        .chat-welcome .quick-tag {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .chat-welcome .quick-tag:hover {
            background: var(--accent-glow);
            border-color: var(--border-active);
            color: var(--accent);
        }

        /* 消息气泡 */
        .msg {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg.user .msg-avatar {
            background: var(--user-bubble);
            color: white;
        }

        .msg.system .msg-avatar {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(56,189,248,0.2);
        }

        .msg-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
        }

        .msg.user .msg-bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.system .msg-bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-bubble p { margin-bottom: 8px; }
        .msg-bubble p:last-child { margin-bottom: 0; }

        .msg-bubble pre {
            background: var(--bg-input);
            padding: 12px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
        }

        .msg-bubble code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.9em;
        }

        .msg-bubble ul, .msg-bubble ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        /* 打字指示器 */
        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: dotPulse 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ========== 输入区域 ========== */
        .input-area {
            padding: 16px 24px 20px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-wrap {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 8px 8px 16px;
            transition: border-color var(--transition), box-shadow var(--transition);
            max-width: 900px;
            margin: 0 auto;
        }

        .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-wrap textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            max-height: 120px;
            min-height: 24px;
            padding: 4px 0;
            font-family: inherit;
        }

        .input-wrap textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--accent-gradient);
            border: none;
            color: white;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(56,189,248,0.3); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .input-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ========== 加载遮罩 ========== */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15,23,42,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            visibility: hidden;
            backdrop-filter: blur(4px);
        }

        .loading-overlay.active { visibility: visible; }

        .loader-ring {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle { display: block; }
            .msg-bubble { max-width: 85%; }
        }
    </style>
</head>
<body>

<!-- ========== 侧边栏 ========== -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
            <div class="logo-text">
                <h2>安保集团</h2>
                <span>企业知识库智能问答</span>
            </div>
        </div>
        <button class="new-chat-btn" id="newSessionBtn">
            <i class="fas fa-plus"></i> 新建对话
        </button>
    </div>

    <div class="session-list" id="sessionList">
        <div class="session-list-label">历史对话</div>
        <!-- 会话列表动态渲染 -->
    </div>

    <div class="sidebar-footer">
        <i class="fas fa-lock" style="margin-right:4px"></i> 企业内部系统 · 数据保密
    </div>
</aside>

<!-- ========== 主区域 ========== -->
<div class="main-area">
    <!-- 顶栏 -->
    <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <div class="topbar-title">
                <span class="dot"></span>
                <span id="topbarLabel">智能问答</span>
            </div>
        </div>
        <div class="topbar-actions">
            <div class="source-select-wrap">
                <label><i class="fas fa-layer-group"></i> 板块</label>
                <select id="sourceFilter">
                    <option value="">全部板块</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 聊天区域 -->
    <div class="chat-area" id="chatArea">
        <div class="chat-welcome" id="chatWelcome">
            <div class="welcome-icon"><i class="fas fa-shield-halved"></i></div>
            <h3>欢迎使用安保集团智能问答</h3>
            <p>我可以帮您解答安保执勤和武装押运相关的制度问题，支持安保执勤、武装押运两大业务板块。</p>
            <div class="quick-tags" id="quickTags">
                <div class="quick-tag" data-q="武装押运的基本流程是什么？">武装押运流程</div>
                <div class="quick-tag" data-q="勤务等级分为哪几级？">勤务等级划分</div>
                <div class="quick-tag" data-q="枪械保管的规定是什么？">枪械保管规定</div>
                <div class="quick-tag" data-q="突发事件应急处置流程是什么？">应急处置流程</div>
            </div>
        </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
        <div class="input-wrap">
            <textarea id="chatInput" rows="1" placeholder="输入您的问题，Enter 发送，Shift+Enter 换行..."></textarea>
            <button class="send-btn" id="sendBtn" title="发送">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <div class="input-hint">按 Enter 发送 · Shift+Enter 换行 · 回答仅供参考，请以正式制度文件为准</div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-ring"></div>
    </div>
</div>

<script>
// ==================== 全局状态 ====================
const sessions = [];          // { id, title, messages: [{role, content}] }
let currentSessionId = null;
let isResponseInProgress = false;
let socket = null;

// 板块中英文映射
const SOURCE_LABELS = {
    'security_duty': '安保执勤',
    'armed_escort':  '武装押运'
};

// DOM
const chatArea      = document.getElementById('chatArea');
const chatWelcome   = document.getElementById('chatWelcome');
const chatInput     = document.getElementById('chatInput');
const sendBtn       = document.getElementById('sendBtn');
const sourceFilter  = document.getElementById('sourceFilter');
const sessionList   = document.getElementById('sessionList');
const newSessionBtn = document.getElementById('newSessionBtn');
const loadingOverlay= document.getElementById('loadingOverlay');
const sidebarToggle = document.getElementById('sidebarToggle');
const sidebar       = document.getElementById('sidebar');
const topbarLabel   = document.getElementById('topbarLabel');
const quickTags     = document.getElementById('quickTags');

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', async () => {
    await loadSources();
    await createNewSession();

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    newSessionBtn.addEventListener('click', createNewSession);
    sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('open'));

    // 快捷标签（流式响应期间不可用）
    quickTags.addEventListener('click', e => {
        const tag = e.target.closest('.quick-tag');
        if (tag && !isResponseInProgress) {
            chatInput.value = tag.dataset.q;
            sendMessage();
        }
    });

    // 自适应输入框高度
    chatInput.addEventListener('input', () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = chatInput.scrollHeight + 'px';
    });

    // 页面关闭前关闭 WebSocket
    window.addEventListener('beforeunload', () => {
        if (socket && socket.readyState === WebSocket.OPEN) socket.close();
    });
});

// ==================== 会话管理 ====================
async function createNewSession() {
    try {
        const res = await fetch('/api/create_session', { method: 'POST' });
        if (!res.ok) throw new Error('创建会话失败');
        const data = await res.json();

        // 创建新会话对象并加入列表（不删除旧会话）
        const session = {
            id: data.session_id,
            title: '新对话',
            messages: []
        };
        sessions.unshift(session);
        switchSession(session.id);
        renderSessionList();
    } catch (err) {
        console.error('创建会话错误:', err);
    }
}

function switchSession(sessionId) {
    // 终止正在进行的流式响应，防止 WebSocket 泄漏和状态锁死
    if (socket) {
        socket.onclose = null;
        socket.onerror = null;
        socket.onmessage = null;
        socket.close();
        socket = null;
    }
    isResponseInProgress = false;
    sendBtn.disabled = false;

    currentSessionId = sessionId;
    const session = sessions.find(s => s.id === sessionId);
    if (!session) return;

    topbarLabel.textContent = `对话 · ${session.title}`;
    renderSessionList();
    renderChat();

    // 如果本地没有消息，尝试从后端加载历史
    if (session.messages.length === 0) {
        loadHistoryFromBackend(sessionId);
    }
}

async function deleteSession(sessionId, e) {
    e.stopPropagation();
    if (!confirm('确定要删除这个对话吗？')) return;

    const idx = sessions.findIndex(s => s.id === sessionId);
    if (idx === -1) return;
    sessions.splice(idx, 1);

    // 通知后端清除历史
    try {
        await fetch(`/api/history/${sessionId}`, { method: 'DELETE' });
    } catch (err) {
        console.error('删除后端历史失败:', err);
    }

    // 如果删的是当前会话，自动切到另一个
    if (currentSessionId === sessionId) {
        if (sessions.length > 0) {
            switchSession(sessions[0].id);
        } else {
            createNewSession();
        }
    } else {
        renderSessionList();
    }
}

function renderSessionList() {
    // 保留标签
    const label = '<div class="session-list-label">历史对话</div>';
    if (sessions.length === 0) {
        sessionList.innerHTML = label + '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px">暂无对话记录</div>';
        return;
    }

    let html = label;
    sessions.forEach(s => {
        const isActive = s.id === currentSessionId;
        const preview = s.messages.length > 0
            ? s.messages[s.messages.length - 1].content.slice(0, 30) + '...'
            : '暂无消息';
        html += `
            <div class="session-item ${isActive ? 'active' : ''}" data-sid="${s.id}" onclick="switchSession('${s.id}')">
                <div class="session-icon"><i class="fas fa-comment-dots"></i></div>
                <div class="session-meta">
                    <div class="session-title">${escapeHtml(s.title)}</div>
                    <div class="session-preview">${escapeHtml(preview)}</div>
                </div>
                <button class="session-delete" onclick="deleteSession('${s.id}', event)" title="删除对话">
                    <i class="fas fa-trash-can"></i>
                </button>
            </div>
        `;
    });
    sessionList.innerHTML = html;
}

function renderChat() {
    const session = sessions.find(s => s.id === currentSessionId);
    if (!session || session.messages.length === 0) {
        chatWelcome.style.display = 'flex';
        // 清除消息但保留 welcome
        const msgs = chatArea.querySelectorAll('.msg');
        msgs.forEach(m => m.remove());
        return;
    }

    chatWelcome.style.display = 'none';
    // 清除现有消息
    const existingMsgs = chatArea.querySelectorAll('.msg');
    existingMsgs.forEach(m => m.remove());

    session.messages.forEach(msg => {
        appendMsgDom(msg.role, msg.content);
    });
    scrollToBottom();
}

// ==================== 板块加载 ====================
async function loadSources() {
    try {
        const res = await fetch('/api/sources');
        if (!res.ok) return;
        const data = await res.json();
        sourceFilter.innerHTML = '<option value="">全部板块</option>';
        data.sources.forEach(src => {
            const opt = document.createElement('option');
            opt.value = src;
            opt.textContent = SOURCE_LABELS[src] || src;
            sourceFilter.appendChild(opt);
        });
    } catch (err) {
        console.error('加载板块错误:', err);
    }
}

// ==================== 从后端加载历史 ====================
async function loadHistoryFromBackend(sessionId) {
    try {
        const res = await fetch(`/api/history/${sessionId}`);
        if (!res.ok) return;
        const data = await res.json();
        const session = sessions.find(s => s.id === sessionId);
        if (!session || !data.history || data.history.length === 0) return;

        // 将后端历史填入会话消息
        data.history.forEach(item => {
            session.messages.push({ role: 'user', content: item.question });
            session.messages.push({ role: 'system', content: item.answer });
        });

        // 更新标题
        if (session.messages.length > 0) {
            const firstQ = data.history[0].question;
            session.title = firstQ.length > 20 ? firstQ.slice(0, 20) + '...' : firstQ;
        }

        // 如果当前仍在这个会话，重新渲染
        if (currentSessionId === sessionId) {
            renderSessionList();
            renderChat();
        }
    } catch (err) {
        console.error('加载后端历史失败:', err);
    }
}

// ==================== 消息发送 ====================
async function sendMessage() {
    const query = chatInput.value.trim();
    const filter = sourceFilter.value;
    if (!query || isResponseInProgress) return;

    const session = sessions.find(s => s.id === currentSessionId);
    if (!session) return;

    // 隐藏欢迎页
    chatWelcome.style.display = 'none';

    // 重置输入
    chatInput.value = '';
    chatInput.style.height = 'auto';

    // 记录用户消息
    session.messages.push({ role: 'user', content: query });
    // 更新会话标题（取第一条消息作为标题）
    if (session.messages.length === 1) {
        session.title = query.length > 20 ? query.slice(0, 20) + '...' : query;
        renderSessionList();
    }

    // 渲染用户消息
    appendMsgDom('user', query);
    isResponseInProgress = true;
    sendBtn.disabled = true;

    // 打字指示器
    const typingEl = document.createElement('div');
    typingEl.className = 'msg system';
    typingEl.innerHTML = `
        <div class="msg-avatar"><i class="fas fa-shield-halved"></i></div>
        <div class="msg-bubble">
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
    `;
    chatArea.appendChild(typingEl);
    scrollToBottom();

    try {
        const res = await fetch('/api/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, source_filter: filter, session_id: currentSessionId })
        });
        if (!res.ok) throw new Error('查询失败');
        const data = await res.json();

        // 移除打字指示器
        typingEl.remove();

        if (data.is_streaming) {
            // 创建系统消息容器
            const { bubble } = appendMsgDom('system', '');
            await handleStreamingResponse(query, filter, bubble);
        } else {
            appendMsgDom('system', data.answer);
            session.messages.push({ role: 'system', content: data.answer });
        }
    } catch (err) {
        typingEl.remove();
        appendMsgDom('system', `抱歉，发生错误: ${err.message}`);
        console.error('发送消息错误:', err);
    } finally {
        isResponseInProgress = false;
        sendBtn.disabled = false;
        scrollToBottom();
    }
}

// ==================== 流式响应 ====================
async function handleStreamingResponse(query, filter, bubbleEl) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.close();

    const sessionIdAtStart = currentSessionId;

    return new Promise((resolve, reject) => {
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${wsProtocol}//${location.host}/api/stream`);
        let accumulated = '';
        let settled = false;

        socket.onopen = () => {
            socket.send(JSON.stringify({
                query, source_filter: filter, session_id: sessionIdAtStart
            }));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            switch (data.type) {
                case 'start': break;
                case 'token':
                    // 仅在会话未被切换时更新 DOM
                    if (currentSessionId === sessionIdAtStart) {
                        accumulated += data.token;
                        bubbleEl.innerHTML = marked.parse(accumulated);
                        scrollToBottom();
                    }
                    break;
                case 'end':
                    socket.close();
                    // 仅在会话匹配时才保存消息到对应会话
                    if (accumulated) {
                        const session = sessions.find(s => s.id === sessionIdAtStart);
                        if (session) session.messages.push({ role: 'system', content: accumulated });
                        renderSessionList();
                    }
                    if (!settled) { settled = true; resolve(); }
                    break;
                case 'error':
                    bubbleEl.innerHTML += `<p style="color:var(--danger)">[错误: ${data.error}]</p>`;
                    socket.close();
                    if (!settled) { settled = true; reject(new Error(data.error)); }
                    break;
            }
        };

        socket.onerror = () => {
            if (!settled) { settled = true; reject(new Error('WebSocket 连接错误')); }
        };

        socket.onclose = () => {
            if (!settled) { settled = true; resolve(); }
        };
    });
}

// ==================== DOM 工具 ====================
function appendMsgDom(role, content) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;

    const iconMap = {
        user: 'fa-user',
        system: 'fa-shield-halved'
    };

    el.innerHTML = `
        <div class="msg-avatar"><i class="fas ${iconMap[role] || 'fa-robot'}"></i></div>
        <div class="msg-bubble">${content ? marked.parse(content) : ''}</div>
    `;
    chatArea.appendChild(el);
    scrollToBottom();

    return { el, bubble: el.querySelector('.msg-bubble') };
}

function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
